[package]
name = "indexer"
version = "2.5.3-palmatum15.1"
edition = "2021"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.12.0", features = ["full"] }
futures = "0.3"
dpp = { git = "https://github.com/dashpay/platform", rev = "5b73d83b50d721d008d638cbcea265f526b19f22" }
data-contracts = { git = "https://github.com/dashpay/platform", rev = "5b73d83b50d721d008d638cbcea265f526b19f22" }
async-trait = { version = "0.1"}
anyhow = { version = "1.0"}
base64 = "0.21.2"
deadpool-postgres = "0.10.5"
refinery = { version = "0.8.10", features = ["tokio-postgres"] }
sha256 = "1.4.0"
dotenv = "0.15.0"
chrono = { version = "0.4.37", features = ["serde"] }
tokio-postgres = { version="0.7.10", features=["with-chrono-0_4", "with-serde_json-1"] }
time = { version="0.3.29", features=["serde"] }
dashcore-rpc = { git = "https://github.com/dashpay/rust-dashcore", rev = "c9aeac0d0dcbd4b91d780a70d61b9bb693199ca4" }
hex = "0.4.3"
bincode_derive = "=2.0.1"

[dev-dependencies]
# Frozen pre-reset fixtures used beta.2's incompatible token-V1 binary layout.
# Test-only: never fall back between protocol decoders on the live chain.
dpp_legacy_beta2 = { package = "dpp", git = "https://github.com/dashpay/platform", rev = "cf8cff9a6891a004362bd36c1eec3c864cc8eeb0" }
